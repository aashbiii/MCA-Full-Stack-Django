<!DOCTYPE html>
<html>
<head>
    <title>CSS Form</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .form-box {
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            padding-right: 35px;
            background-color: white;
            border-radius: 8px;
        }

        .input-box {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .submit-button {
            width: 80%;
            background-color: green;
            color: white;
            padding: 8px;
            margin-left: 15%;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .submit-button:hover {
            background-color: darkgreen;
        }
    </style>
</head>
<body>

    <div class="form-box">
        <h2>Registration Form</h2>
        <form>
            <label>Name</label>
            <input type="text" class="input-box" placeholder="Enter your name">

            <label>Email</label>
            <input type="email" class="input-box" placeholder="Enter your email">

            <label>Password</label>
            <input type="password" class="input-box" placeholder="Enter password">

            <input type="submit" class="submit-button" value="Register">
        </form>
    </div>

</body>
</html>
