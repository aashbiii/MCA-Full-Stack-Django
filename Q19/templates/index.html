<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suggestion Form - Flask AJAX</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 6px;
            font-size: 1.8rem;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 35px;
            font-size: 0.95rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* ── Form Card ── */
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .card h2 {
            color: #4a5568;
            font-size: 1.1rem;
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #4a5568;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 7px;
        }

        label span { color: #e53e3e; }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #2d3748;
            background: #f7fafc;
            outline: none;
            transition: border 0.25s, background 0.25s;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #667eea;
            background: #fff;
        }

        textarea { resize: vertical; min-height: 110px; }

        #char-count {
            text-align: right;
            font-size: 0.78rem;
            color: #a0aec0;
            margin-top: 4px;
        }

        #submit-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: opacity 0.2s, transform 0.1s;
        }

        #submit-btn:hover { opacity: 0.9; }
        #submit-btn:active { transform: scale(0.98); }
        #submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* ── Alert ── */
        .alert {
            padding: 13px 16px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 0.92rem;
            display: none;
        }

        .alert.success {
            background: #c6f6d5;
            color: #276749;
            border-left: 4px solid #38a169;
        }

        .alert.error {
            background: #fed7d7;
            color: #9b2c2c;
            border-left: 4px solid #e53e3e;
        }

        /* ── Suggestions List ── */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }

        .list-header h2 { border: none; padding: 0; margin: 0; }

        #total-badge {
            background: #667eea;
            color: #fff;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        #suggestions-list { list-style: none; }

        .suggestion-item {
            background: #f7fafc;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 4px solid #667eea;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .suggestion-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .suggestion-name {
            font-weight: 700;
            color: #2d3748;
            font-size: 0.95rem;
        }

        .suggestion-email {
            color: #718096;
            font-size: 0.8rem;
        }

        .category-tag {
            background: #ebf4ff;
            color: #3182ce;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .suggestion-message {
            color: #4a5568;
            font-size: 0.92rem;
            line-height: 1.5;
        }

        .suggestion-time {
            color: #a0aec0;
            font-size: 0.75rem;
            margin-top: 8px;
            text-align: right;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #a0aec0;
        }

        .empty-state .icon { font-size: 2.5rem; margin-bottom: 8px; }

        #refresh-btn {
            background: none;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 5px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        #refresh-btn:hover { background: #667eea; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h1>💡 Suggestion Box</h1>
    <p class="subtitle">Share your ideas and feedback with us. We value every suggestion!</p>

    <!-- Form Card -->
    <div class="card">
        <h2>📝 Submit a Suggestion</h2>

        <div id="alert" class="alert"></div>

        <div class="form-row">
            <div class="form-group">
                <label>Full Name <span>*</span></label>
                <input type="text" id="name" placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Email Address <span>*</span></label>
                <input type="email" id="email" placeholder="john@example.com">
            </div>
        </div>

        <div class="form-group">
            <label>Category</label>
            <select id="category">
                <option value="">-- Select a Category --</option>
                <option value="Website">🌐 Website</option>
                <option value="Service">🛠️ Service</option>
                <option value="Product">📦 Product</option>
                <option value="Support">💬 Support</option>
                <option value="General">📌 General</option>
            </select>
        </div>

        <div class="form-group">
            <label>Your Suggestion <span>*</span></label>
            <textarea id="message" placeholder="Write your suggestion here..." maxlength="300"></textarea>
            <div id="char-count">0 / 300</div>
        </div>

        <button id="submit-btn">Submit Suggestion</button>
    </div>

    <!-- Suggestions List Card -->
    <div class="card">
        <div class="list-header">
            <h2>📋 All Suggestions</h2>
            <div style="display:flex; gap:10px; align-items:center;">
                <span id="total-badge">0 total</span>
                <button id="refresh-btn">↻ Refresh</button>
            </div>
        </div>
        <ul id="suggestions-list">
            <li class="empty-state">
                <div class="icon">📭</div>
                <div>No suggestions yet. Be the first!</div>
            </li>
        </ul>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    // Character counter
    $('#message').on('input', function () {
        $('#char-count').text($(this).val().length + ' / 300');
    });

    // Show alert helper
    function showAlert(type, msg) {
        $('#alert')
            .removeClass('success error')
            .addClass(type)
            .text(msg)
            .fadeIn(300);
        setTimeout(() => $('#alert').fadeOut(400), 4000);
    }

    // ── Submit via AJAX ──
    $('#submit-btn').click(function () {
        const payload = {
            name:     $('#name').val(),
            email:    $('#email').val(),
            category: $('#category').val(),
            message:  $('#message').val()
        };

        $('#submit-btn').prop('disabled', true).text('Submitting...');

        $.ajax({
            url: '/submit',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(payload),
            success: function (data) {
                if (data.success) {
                    showAlert('success', data.message);
                    // Clear form
                    $('#name, #email, #message').val('');
                    $('#category').val('');
                    $('#char-count').text('0 / 300');
                    // Update badge and reload list
                    $('#total-badge').text(data.total + ' total');
                    loadSuggestions();
                } else {
                    showAlert('error', data.error);
                }
            },
            error: function () {
                showAlert('error', 'Server error. Please try again.');
            },
            complete: function () {
                $('#submit-btn').prop('disabled', false).text('Submit Suggestion');
            }
        });
    });

    // ── Load suggestions via AJAX ──
    function loadSuggestions() {
        $.ajax({
            url: '/suggestions',
            type: 'GET',
            success: function (data) {
                const list = $('#suggestions-list');
                list.empty();

                if (data.suggestions.length === 0) {
                    list.html(`
                        <li class="empty-state">
                            <div class="icon">📭</div>
                            <div>No suggestions yet. Be the first!</div>
                        </li>`);
                    return;
                }

                $('#total-badge').text(data.suggestions.length + ' total');

                data.suggestions.forEach(function (s) {
                    list.append(`
                        <li class="suggestion-item">
                            <div class="suggestion-meta">
                                <div>
                                    <span class="suggestion-name">${s.name}</span>
                                    <span class="suggestion-email"> &lt;${s.email}&gt;</span>
                                </div>
                                <span class="category-tag">${s.category}</span>
                            </div>
                            <div class="suggestion-message">${s.message}</div>
                            <div class="suggestion-time">🕒 ${s.timestamp}</div>
                        </li>`);
                });
            }
        });
    }

    // Refresh button
    $('#refresh-btn').click(loadSuggestions);

    // Load on page ready
    loadSuggestions();
</script>

</body>
</html>
