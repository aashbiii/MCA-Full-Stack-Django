<!DOCTYPE html>
<html>
<head>
    <title>Greet User</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #fff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 400px;
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
        }

        .input_box {
            padding: 12px;
            margin: 10px 0;
            width: 80%;
            font-size: 16px;
            border: 1.5px solid #007bff;
            border-radius: 8px;
            transition: 0.3s;
        }

        .input_box:focus {
            border-color: #28a745;
            box-shadow: 0 0 5px rgba(40,167,69,0.5);
            outline: none;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        #greeting {
            font-size: 18px;
            margin-top: 25px;
            font-weight: 500;
            color: #333;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Enter Your Name</h2>

    <input
        type="text"
        class="input_box"
        id="username"
        placeholder="Enter your name"
    >

    <br>
    <button onclick="greet()">Submit</button>

    <p id="greeting"></p>
</div>

<script>
    function greet() {
        let name = document.getElementById("username").value.trim();
        let greeting = document.getElementById("greeting");

        if (name === "") {
            greeting.innerText = "Please enter your name!";
            greeting.style.color = "red";
        } else {
            greeting.innerText = "Hello, " + name + "! Welcome 😊";
            greeting.style.color = "green";
        }
    }
</script>

</body>
</html>
