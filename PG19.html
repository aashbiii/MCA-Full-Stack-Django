<!DOCTYPE html>
<html>
<head>
    <title>Random Background Color</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
            transition: background-color 0.5s; /* Smooth transition */
        }

        h2 {
            font-size: 32px;
            margin-bottom: 40px;
            color: #333;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #0e3660;
            color: rgb(192, 192, 192);
            transition: 0.3s;
        }

        button:hover {
            background-color: #0b1825;
        }

        p {
            margin-top: 30px;
            font-size: 20px;
            color: #333;
        }
    </style>
</head>
<body>

<h2>Random Background Color</h2>

<button onclick="changeBackground()">Change Color</button>

<p id="colorName"></p>

<script>
    function changeBackground() {
        // Generate random RGB values
        const r = Math.floor(Math.random() * 256);
        const g = Math.floor(Math.random() * 256);
        const b = Math.floor(Math.random() * 256);

        // Create RGB color string
        const color = `rgb(${r}, ${g}, ${b})`;

        // Change background color
        document.body.style.backgroundColor = color;

        // Display color code
        document.getElementById("colorName").innerText = "Background Color: " + color;
    }
</script>

</body>
</html>
