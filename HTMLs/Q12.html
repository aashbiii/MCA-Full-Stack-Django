<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Live Weather</title>
    <style>
        body {
            margin: 0;
            font-family: Segoe UI, Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #ffffff;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 12px;
            width: 380px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .title {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .search {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            outline: none;
        }

        .search button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            background: #ffffff;
            color: #0984e3;
            font-weight: 600;
        }

        .weather {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .box {
            background: rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 8px;
        }

        .label {
            font-size: 13px;
            opacity: 0.8;
        }

        .value {
            font-size: 18px;
            font-weight: 600;
            margin-top: 4px;
        }

        .city {
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="title">Weather Finder</div>
        <div class="search">
            <input type="text" id="city" placeholder="Enter city">
            <button onclick="getWeather()">Search</button>
        </div>
        <div class="city" id="cityName">--</div>
        <div class="weather">
            <div class="box">
                <div class="label">Temperature</div>
                <div class="value" id="temp">--</div>
            </div>
            <div class="box">
                <div class="label">Condition</div>
                <div class="value" id="condition">--</div>
            </div>
            <div class="box">
                <div class="label">Humidity</div>
                <div class="value" id="humidity">--</div>
            </div>
            <div class="box">
                <div class="label">Wind</div>
                <div class="value" id="wind">--</div>
            </div>
        </div>
    </div>
    <script>
        function getWeather() {

            var city = document.getElementById("city").value.trim();

            if (city === "") {
                alert("Enter city name");
                return;
            }

            document.getElementById("cityName").innerHTML = "Loading...";

            fetch("https://wttr.in/" + city + "?format=j1", {
                method: "GET",
                headers: {
                    "Accept": "application/json"
                }
            })

                .then(response => {

                    if (!response.ok) {
                        throw new Error("City not found");
                    }

                    return response.json();

                })

                .then(data => {

                    const weather = data.current_condition[0];

                    document.getElementById("cityName").innerHTML = city.toUpperCase();

                    document.getElementById("temp").innerHTML =
                        weather.temp_C + " °C";

                    document.getElementById("condition").innerHTML =
                        weather.weatherDesc[0].value;

                    document.getElementById("humidity").innerHTML =
                        weather.humidity + " %";

                    document.getElementById("wind").innerHTML =
                        weather.windspeedKmph + " km/h";

                })

                .catch(error => {

                    document.getElementById("cityName").innerHTML =
                        "City not found";

                });

        }
    </script>
</body>

</html>
