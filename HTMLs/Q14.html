<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Auth Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
        }

        .auth-box {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .left-side {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            height: 100%;
        }

        .left-side h2 {
            font-weight: 700;
        }

        .form-control {
            border-radius: 8px;
        }

        .btn-custom {
            border-radius: 8px;
            padding: 10px;
            font-weight: 600;
        }

        .nav-pills .nav-link {
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="auth-box row g-0">
                    <div class="col-md-5 d-none d-md-flex left-side">
                        <div>
                            <h2>Welcome Back</h2>
                            <p>Access your dashboard and manage your account</p>
                        </div>
                    </div>
                    <div class="col-md-7 p-4">
                        <ul class="nav nav-pills nav-justified mb-3">
                            <li class="nav-item">
                                <button class="nav-link active" data-bs-toggle="pill"
                                    data-bs-target="#login">Login</button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link" data-bs-toggle="pill"
                                    data-bs-target="#register">Register</button>
                            </li>
                        </ul>
                        <div class="tab-content">
                            <div class="tab-pane fade show active" id="login">
                                <div class="mb-3">
                                    <label>Email</label>
                                    <input type="email" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label>Password</label>
                                    <input type="password" class="form-control">
                                </div>
                                <div class="d-grid">
                                    <button class="btn btn-primary btn-custom">Login</button>
                                </div>
                            </div>
                            <div class="tab-pane fade" id="register">
                                <div class="mb-3">
                                    <label>Full Name</label>
                                    <input type="text" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label>Email</label>
                                    <input type="email" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label>Password</label>
                                    <input type="password" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label>Confirm Password</label>
                                    <input type="password" class="form-control">
                                </div>
                                <div class="d-grid">
                                    <button class="btn btn-success btn-custom">Register</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
