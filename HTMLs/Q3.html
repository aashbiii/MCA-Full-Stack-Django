<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>FoodExpress Flexbox Demo</title>
    <style>
        body {
            margin: 0;
            font-family: Segoe UI, Arial, sans-serif;
            background: #f6f8fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #ffffff;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .brand {
            font-size: 24px;
            font-weight: 600;
            color: #e67e22;
        }

        .menu {
            display: flex;
            gap: 25px;
        }

        .menu a {
            text-decoration: none;
            color: #2c3e50;
            font-weight: 500;
        }

        .main {
            flex: 1;
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .left {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .food-list {
            display: flex;
            gap: 20px;
        }

        .food {
            flex: 1;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .food h3 {
            margin: 0;
        }

        .food button {
            margin-top: 10px;
            padding: 8px;
            border: none;
            background: #e67e22;
            color: white;
            border-radius: 5px;
        }

        .offer {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .right {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .order {
            display: flex;
            justify-content: space-between;
            background: #eef2f5;
            padding: 10px;
            border-radius: 5px;
        }

        footer {
            background: white;
            text-align: center;
            padding: 10px;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body>
    <header>
        <div class="brand">FoodExpress</div>
        <div class="menu">
            <a href="#">Home</a>
            <a href="#">Menu</a>
            <a href="#">Orders</a>
            <a href="#">Account</a>
        </div>
    </header>
    <div class="main">
        <div class="left">
            <div class="food-list">
                <div class="food">
                    <h3>Pizza</h3>
                    <p>Price: ₹299</p>
                    <button>Order</button>
                </div>
                <div class="food">
                    <h3>Burger</h3>
                    <p>Price: ₹149</p>
                    <button>Order</button>
                </div>
                <div class="food">
                    <h3>Pasta</h3>
                    <p>Price: ₹199</p>
                    <button>Order</button>
                </div>
            </div>
            <div class="offer">
                <div>
                    <h2>Special Offer</h2>
                    <p>Get 20% discount on all items today</p>
                </div>
                <button>View Offer</button>
            </div>
        </div>
        <div class="right">
            <h3>Recent Orders</h3>
            <div class="order">
                <span>Pizza</span>
                <span>₹299</span>
            </div>
            <div class="order">
                <span>Burger</span>
                <span>₹149</span>
            </div>
            <div class="order">
                <span>Pasta</span>
                <span>₹199</span>
            </div>
        </div>
    </div>
    <footer>
        Online Food Delivery Flexbox Page
    </footer>
</body>

</html>
