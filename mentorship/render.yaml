services:
  - type: web
    name: mentorspace
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn mentorship_project.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: mentorspace-db
          property: connectionString

databases:
  - name: mentorspace-db
    databaseName: mentorspace
    user: mentorspace
