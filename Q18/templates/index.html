<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask AJAX Calculator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            background: #16213e;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            width: 360px;
        }

        h2 {
            text-align: center;
            color: #e94560;
            margin-bottom: 20px;
            font-size: 1.4rem;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #a8b2d8;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #0f3460;
            border-radius: 10px;
            background: #0f3460;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: border 0.3s;
        }

        input[type="number"]:focus {
            border-color: #e94560;
        }

        .operator-group {
            margin-bottom: 20px;
        }

        .operators {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 6px;
        }

        .op-btn {
            padding: 14px;
            border: 2px solid #0f3460;
            border-radius: 10px;
            background: #0f3460;
            color: #a8b2d8;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .op-btn:hover {
            background: #e94560;
            border-color: #e94560;
            color: #fff;
        }

        .op-btn.active {
            background: #e94560;
            border-color: #e94560;
            color: #fff;
        }

        #calculate-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e94560, #c0392b);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            transition: opacity 0.2s;
        }

        #calculate-btn:hover { opacity: 0.85; }

        .result-box {
            margin-top: 20px;
            padding: 16px;
            background: #0f3460;
            border-radius: 10px;
            text-align: center;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #result {
            font-size: 1.6rem;
            font-weight: bold;
            color: #4ecca3;
        }

        #result.error {
            color: #e94560;
            font-size: 1rem;
        }

        #expression {
            color: #a8b2d8;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 8px;
            min-height: 18px;
        }
    </style>
</head>
<body>

<div class="calculator">
    <h2>⚡ AJAX Calculator</h2>

    <div class="input-group">
        <label>First Number</label>
        <input type="number" id="num1" placeholder="Enter first number">
    </div>

    <div class="operator-group">
        <label>Operator</label>
        <div class="operators">
            <button class="op-btn" data-op="+">+</button>
            <button class="op-btn" data-op="-">−</button>
            <button class="op-btn" data-op="*">×</button>
            <button class="op-btn" data-op="/">÷</button>
        </div>
    </div>

    <div class="input-group">
        <label>Second Number</label>
        <input type="number" id="num2" placeholder="Enter second number">
    </div>

    <button id="calculate-btn">Calculate</button>

    <div class="result-box">
        <span id="result">—</span>
    </div>
    <div id="expression"></div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    let selectedOp = null;

    // Operator button selection
    $('.op-btn').click(function () {
        $('.op-btn').removeClass('active');
        $(this).addClass('active');
        selectedOp = $(this).data('op');
    });

    // Calculate via AJAX
    $('#calculate-btn').click(function () {
        const num1 = $('#num1').val();
        const num2 = $('#num2').val();

        if (num1 === '' || num2 === '') {
            showError('Please enter both numbers.');
            return;
        }
        if (!selectedOp) {
            showError('Please select an operator.');
            return;
        }

        $.ajax({
            url: '/calculate',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ num1: num1, num2: num2, operator: selectedOp }),
            success: function (data) {
                if (data.error) {
                    showError(data.error);
                } else {
                    const opSymbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
                    $('#result').text(data.result).removeClass('error');
                    $('#expression').text(
                        `${num1}  ${opSymbols[selectedOp]}  ${num2}  =  ${data.result}`
                    );
                }
            },
            error: function () {
                showError('Server error. Please try again.');
            }
        });
    });

    // Allow Enter key to trigger calculation
    $('input').keypress(function (e) {
        if (e.which === 13) $('#calculate-btn').click();
    });

    function showError(msg) {
        $('#result').text(msg).addClass('error');
        $('#expression').text('');
    }
</script>

</body>
</html>
